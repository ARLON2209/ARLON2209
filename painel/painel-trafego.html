<title>Painel de Tráfego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de telas + área de trabalho; no celular a barra vira abas no topo. Tokens do design system "Painel de Tráfego". */
:root {
  --bg-000:#0b0d10; --bg-100:#14171c; --bg-200:#1c2027; --line:#2a2f38; --line-strong:#6b7480;
  --ink:#e8eaed; --ink-muted:#9aa3ae; --accent:#3ddc84; --accent-ink:#04210f; --accent-tint:#11291c;
  --info:#6cb4ff; --info-tint:#132235; --warn:#f5b83d; --warn-tint:#2b2210; --danger:#ff7a7a; --danger-tint:#2e1618;
  --scrim:rgba(0,0,0,.6); --shadow-pop:0 12px 32px rgba(0,0,0,.55);
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg-000:#f5f6f8; --bg-100:#ffffff; --bg-200:#eceef2; --line:#dde1e6; --line-strong:#7c8490;
  --ink:#14171c; --ink-muted:#5a6370; --accent:#0b7a3f; --accent-ink:#ffffff; --accent-tint:#e1f4e8;
  --info:#1d5fb8; --info-tint:#e2edfb; --warn:#8a5a00; --warn-tint:#fbf0d6; --danger:#c0292b; --danger-tint:#fbe3e3;
  --scrim:rgba(20,23,28,.4); --shadow-pop:0 12px 32px rgba(20,23,28,.14); color-scheme: light; } }
:root[data-theme="light"] {
  --bg-000:#f5f6f8; --bg-100:#ffffff; --bg-200:#eceef2; --line:#dde1e6; --line-strong:#7c8490;
  --ink:#14171c; --ink-muted:#5a6370; --accent:#0b7a3f; --accent-ink:#ffffff; --accent-tint:#e1f4e8;
  --info:#1d5fb8; --info-tint:#e2edfb; --warn:#8a5a00; --warn-tint:#fbf0d6; --danger:#c0292b; --danger-tint:#fbe3e3;
  --scrim:rgba(20,23,28,.4); --shadow-pop:0 12px 32px rgba(20,23,28,.14); color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg-000); color: var(--ink); font: 14px/20px var(--font-sans); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }
.label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }

.app { display: flex; min-height: 100%; }
.nav { width: 220px; flex: none; background: var(--bg-100); border-right: 1px solid var(--line); padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { font: 600 14px/20px var(--font-mono); padding: var(--space-1) var(--space-2) var(--space-4); }
.brand span { color: var(--accent); }
.nav-item { display: flex; justify-content: flex-start; align-items: center; background: transparent; border: 0; border-radius: var(--radius-md); padding: var(--space-2); color: var(--ink-muted); font-weight: 500; cursor: pointer; text-align: left; white-space: nowrap; }
.nav-item:hover { background: var(--bg-200); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--bg-200); color: var(--ink); }
.nav-item[aria-current="page"]::before { content: "›"; color: var(--accent); font-family: var(--font-mono); margin-right: 6px; }
.nav-item .count { font: 500 11px/16px var(--font-mono); color: var(--ink-muted); margin-left: auto; padding-left: var(--space-2); }
.nav-item .count.hot { color: var(--warn); }
.nav-foot { margin-top: auto; font-size: 12px; color: var(--ink-muted); padding: var(--space-2); }

.main { flex: 1; min-width: 0; padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }

.seg { display: inline-flex; background: var(--bg-100); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 2px; }
.seg button { background: transparent; border: 0; border-radius: 6px; padding: 6px var(--space-3); color: var(--ink-muted); cursor: pointer; font-weight: 500; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--bg-200); color: var(--ink); }

.btn { font-weight: 500; border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.btn-sm { font-size: 13px; padding: var(--space-1) var(--space-3); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { background: var(--bg-100); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--bg-200); }
.btn-ghost { background: transparent; color: var(--ink-muted); }
.btn-ghost:hover { background: var(--bg-200); color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.card { background: var(--bg-100); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
.kpi { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.kpi b { font: 600 clamp(19px, 4.6vw, 26px)/32px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi small { font: 400 12px/16px var(--font-mono); color: var(--ink-muted); }

.badge { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--font-sans); padding: 2px var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
.b-ativa { background: var(--accent-tint); color: var(--accent); }
.b-pausada { background: var(--bg-200); color: var(--ink-muted); }
.b-revisao { background: var(--info-tint); color: var(--info); }
.b-alerta { background: var(--warn-tint); color: var(--warn); }
.b-erro { background: var(--danger-tint); color: var(--danger); }
.plat { font: 600 10px/14px var(--font-mono); letter-spacing: .06em; padding: 1px 5px; border-radius: var(--radius-sm); border: 1px solid var(--line); color: var(--ink-muted); }

.toolbar { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.search { flex: 1; min-width: 180px; max-width: 360px; background: var(--bg-100); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.select { background: var(--bg-100); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }

.accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
.acc { display: flex; flex-direction: column; gap: var(--space-3); cursor: pointer; text-align: left; width: 100%; color: inherit; }
.acc:hover { border-color: var(--line-strong); }
.acc-head { display: flex; justify-content: space-between; gap: var(--space-2); align-items: flex-start; }
.acc-name { font-weight: 600; font-size: 15px; line-height: 22px; overflow-wrap: anywhere; }
.acc-id { font: 400 12px/16px var(--font-mono); color: var(--ink-muted); display: flex; gap: var(--space-2); align-items: center; }
.acc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); border-top: 1px solid var(--line); padding-top: var(--space-3); }
.acc-stats b { display: block; font: 600 15px/22px var(--font-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; line-height: 16px; border-radius: var(--radius-sm); padding: var(--space-1) var(--space-2); }
.note.alerta { background: var(--warn-tint); color: var(--warn); }
.note.erro { background: var(--danger-tint); color: var(--danger); }
.note.info { background: var(--info-tint); color: var(--info); }

.table-wrap { background: var(--bg-100); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: var(--space-2) var(--space-3); background: var(--bg-200); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
td { padding: var(--space-3); border-top: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.num { font-family: var(--font-sans); }
tr.edited > td { background: var(--accent-tint); }
tr.sub > td { background: var(--bg-000); }
tr.sub td:first-child { padding-left: var(--space-6); }
.cname { font-weight: 500; min-width: 180px; }
.cobj { font-size: 12px; color: var(--ink-muted); }
.expander { background: transparent; border: 0; color: var(--ink-muted); cursor: pointer; font-family: var(--font-mono); padding: 0 var(--space-1); }

.toggle { position: relative; width: 36px; height: 20px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--bg-200); cursor: pointer; padding: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: var(--radius-pill); background: var(--ink-muted); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent-ink); }
.toggle:disabled { opacity: .45; cursor: not-allowed; }

.state { display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; padding: var(--space-6); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--ink-muted); }
.state strong { color: var(--ink); }
.skel { background: linear-gradient(90deg, var(--bg-100), var(--bg-200), var(--bg-100)); background-size: 200% 100%; animation: sh 1.4s infinite; border-radius: var(--radius-lg); min-height: 150px; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: var(--space-4); z-index: 20; }
.dialog { background: var(--bg-100); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: var(--space-6); width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: var(--space-4); }
.change { display: grid; gap: var(--space-1); padding: var(--space-3); background: var(--bg-200); border-radius: var(--radius-md); }
.change .ft { font: 400 13px/20px var(--font-mono); color: var(--ink-muted); }
.change .ft b { color: var(--ink); }
.field { display: flex; align-items: center; background: var(--bg-200); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 0 var(--space-3); }
.field:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.field span { color: var(--ink-muted); font-family: var(--font-mono); }
.field input { flex: 1; background: transparent; border: 0; outline: none; font: 500 16px/22px var(--font-mono); padding: var(--space-2); min-width: 0; }
.chips { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.chip { font: 500 12px/16px var(--font-mono); background: var(--bg-200); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-1) var(--space-2); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--line-strong); }
.actions { display: flex; justify-content: flex-end; gap: var(--space-2); flex-wrap: wrap; }

.toast { position: fixed; right: var(--space-4); bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px)); background: var(--bg-100); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: var(--space-3) var(--space-4); max-width: min(420px, calc(100vw - 32px)); z-index: 30; }
.toast.ok { border-color: var(--accent); }
.toast.err { border-color: var(--danger); }

.chat { display: flex; flex-direction: column; gap: var(--space-4); }
.msgs { display: flex; flex-direction: column; gap: var(--space-4); }
.msg { display: flex; gap: var(--space-3); align-items: flex-start; }
.who { font: 600 12px/20px var(--font-mono); min-width: 64px; flex: none; }
.msg.user .who { color: var(--accent); }
.msg.assistant .who { color: var(--info); }
.body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .body { background: var(--bg-200); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.tool { font: 400 12px/16px var(--font-mono); color: var(--ink-muted); white-space: normal; }
.tool::before { content: "⏺ "; color: var(--accent); }
.cmd { display: flex; gap: var(--space-2); align-items: center; background: var(--bg-100); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.cmd:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.cmd .p { color: var(--accent); font: 600 16px/22px var(--font-mono); }
.cmd input { flex: 1; background: transparent; border: 0; outline: none; font: 400 14px/22px var(--font-mono); min-width: 0; }
.cmd input::placeholder { color: var(--ink-muted); }

.log { display: flex; flex-direction: column; }
.log-item { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--line); }
.log-item:first-child { border-top: 0; }

@media (max-width: 760px) {
  .app { flex-direction: column; }
  .nav { width: auto; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: var(--space-2) var(--space-4); z-index: 10; }
  .brand, .nav-foot { display: none; }
  .main { padding: var(--space-4); }
  h1 { font-size: 24px; line-height: 30px; }
}
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .toggle::after { transition: none; } }
</style>

<div class="app">
  <nav class="nav" aria-label="Telas" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var SERVER = "Criativivo";
  var mcp = null, sample = null, ready = false, noRuntime = false;

  var S = {
    screen: "geral", period: "7d", q: "", plat: "todas", sort: "gasto",
    accounts: [], accErr: null, loadingAcc: true,
    summary: {}, sumErr: [], loadingSum: false, sumTotals: null,
    balance: {}, balErr: [], loadingBal: false,
    current: null, camps: {}, adsets: {}, open: {},
    pending: null, busy: false,
    chat: [], chatBusy: false, chatCtl: null,
    log: loadLog(), updatedAt: null
  };

  // ---------- util ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function brl(n) { return n == null || isNaN(n) ? "—" : "R$ " + Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function int(n) { return n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("pt-BR"); }
  function pct(n) { return n == null || isNaN(n) ? "—" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%"; }
  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function parseBRL(s) { if (s == null) return null; var t = String(s).replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", "."); var n = parseFloat(t); return isNaN(n) ? null : n; }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function chunk(a, n) { var r = []; for (var i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; }
  var PERIODS = { hoje: "Hoje", ontem: "Ontem", "7d": "7 dias", "30d": "30 dias" };
  function range(p) {
    var t = new Date(), s = new Date(t), e = new Date(t);
    if (p === "ontem") { s.setDate(t.getDate() - 1); e.setDate(t.getDate() - 1); }
    if (p === "7d") { s.setDate(t.getDate() - 7); e.setDate(t.getDate() - 1); }
    if (p === "30d") { s.setDate(t.getDate() - 30); e.setDate(t.getDate() - 1); }
    var days = Math.round((e - s) / 864e5) + 1;
    return { startDate: ymd(s), endDate: ymd(e), days: days };
  }
  function loadLog() { try { return JSON.parse(localStorage.getItem("painel-historico") || "[]"); } catch (e) { return []; } }
  function saveLog() { try { localStorage.setItem("painel-historico", JSON.stringify(S.log.slice(0, 200))); } catch (e) {} }

  var toastT;
  function toast(msg, kind) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.className = "toast " + (kind || ""); t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 6000);
  }

  // ---------- conector ----------
  function errText(e, action) {
    var c = e && e.code;
    if (c === "server_not_connected" || c === "selection_required") return "O conector Criativivo não está conectado na sua conta. Adicione em claude.ai → Configurações → Conectores.";
    if (c === "needs_reauth") return "A conexão com o Criativivo expirou. Reconecte em claude.ai → Configurações → Conectores.";
    if (c === "not_in_manifest" || c === "consent_required") return "Você não liberou o Criativivo para este painel. Recarregue a página e permita o acesso quando for perguntado.";
    if (c === "blocked_by_policy" || c === "approval_required") return "A política da sua organização bloqueia esta ferramenta do Criativivo.";
    if (c === "truncated") return "O Criativivo devolveu uma resposta cortada (muitos dados de uma vez).";
    if (c === "tool_error") {
      var m = (e.message || "").slice(0, 300);
      if (action) return "O Criativivo recusou: " + m + " — Se for a primeira edição, ligue \"Permitir edições\" em criativivo.com.br/mcp-config.";
      return "O Criativivo respondeu com erro: " + m;
    }
    if (c === "server_unavailable" || c === "upstream_error") return action ? "Sem resposta do Criativivo. Não dá para saber se a alteração foi aplicada: recarregue a conta para conferir antes de tentar de novo." : "O Criativivo não respondeu agora. Tente atualizar em instantes.";
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Este visualizador não permite conectores. Abra o painel em claude.ai.";
    return (e && e.message) || "Erro desconhecido.";
  }
  function call(tool, input, opts) {
    opts = opts || {};
    if (!mcp) return Promise.reject({ code: "not_granted", message: "sem mcp" });
    var o = opts.write ? { cache: false } : { cache: { staleTime: 120000, gcTime: 600000, refresh: !!opts.fresh } };
    return mcp.callTool(SERVER, tool, input, o).then(function (r) {
      var p = r.payload;
      if (typeof p === "string") {
        if (p.indexOf("TRUNCADO") >= 0) throw { code: "truncated", message: "resposta truncada" };
        try { p = JSON.parse(p); } catch (e) { if (!opts.write) throw { code: "tool_error", message: p.slice(0, 300) }; }
      }
      return p;
    });
  }
  function retryOnce(fn) {
    return fn().catch(function (e) {
      if (e && e.retryable) return new Promise(function (res) { setTimeout(res, (e.retryAfterMs || 1500) + Math.random() * 800); }).then(fn);
      throw e;
    });
  }

  // ---------- dados ----------
  function loadAccounts(fresh) {
    S.loadingAcc = true; S.accErr = null; render();
    return retryOnce(function () { return call("list_ad_accounts", {}, { fresh: fresh }); }).then(function (p) {
      S.accounts = (p && p.accounts || []).map(function (a) { return { id: String(a.accountId), name: String(a.name || "").trim(), platform: a.platform }; });
      S.loadingAcc = false; render();
      loadSummary(fresh); loadBalance(fresh);
    }).catch(function (e) { S.loadingAcc = false; S.accErr = e; render(); });
  }

  function loadSummary(fresh) {
    var r = range(S.period), ids = S.accounts.map(function (a) { return a.id; });
    if (!ids.length) return;
    S.loadingSum = true; S.sumErr = []; var period = S.period, got = {};
    render();
    var jobs = chunk(ids, 6).map(function (batch) {
      return retryOnce(function () { return call("get_all_accounts_summary", { startDate: r.startDate, endDate: r.endDate, accountIds: batch }, { fresh: fresh }); })
        .then(function (p) {
          (p.accounts || []).forEach(function (row) { got[String(row.accountId)] = row; });
          (p.failed || []).forEach(function (f) { S.sumErr.push({ ids: [String(f.accountId || f.id || "")], e: { code: "tool_error", message: f.error || f.message || "falhou" } }); });
        })
        .catch(function (e) { S.sumErr.push({ ids: batch, e: e }); });
    });
    Promise.all(jobs).then(function () {
      if (period !== S.period) return;
      S.summary = got; S.loadingSum = false; S.updatedAt = new Date(); render();
    });
  }

  function loadBalance(fresh) {
    var ids = S.accounts.map(function (a) { return a.id; });
    if (!ids.length) return;
    S.loadingBal = true; S.balErr = []; var got = {};
    render();
    var jobs = chunk(ids, 4).map(function (batch) {
      return retryOnce(function () { return call("get_all_accounts_balance", { accountIds: batch }, { fresh: fresh }); })
        .then(function (p) { (p.accounts || []).forEach(function (row) { got[String(row.accountId)] = row; }); })
        .catch(function (e) { S.balErr.push({ ids: batch, e: e }); });
    });
    Promise.all(jobs).then(function () { S.balance = got; S.loadingBal = false; render(); });
  }

  function loadCampaigns(accId, fresh) {
    var r = range(S.period), key = accId + "|" + S.period;
    S.camps[key] = { loading: true }; render();
    return retryOnce(function () { return call("get_meta_campaigns", { accountId: accId, startDate: r.startDate, endDate: r.endDate }, { fresh: fresh }); })
      .then(function (p) {
        var ins = {}; (p.insights || []).forEach(function (i) { ins[String(i.campaign_id)] = i; });
        var list = (p.campaigns || []).map(function (c) {
          var i = ins[String(c.id)] || {}, m = actionsMap(i.actions);
          return { id: String(c.id), name: c.name, status: c.status, objective: c.objective, cbo: !!c.has_cbo,
            daily: c.daily_budget_reais != null ? num(c.daily_budget_reais) : null, lifetime: c.lifetime_budget_reais,
            spend: num(i.spend), clicks: num(i.clicks), impressions: num(i.impressions), ctr: i.ctr != null ? num(i.ctr) : null,
            leads: leadsOf(m), msgs: msgsOf(m), buys: num(m.omni_purchase) };
        });
        list.sort(function (a, b) { return (b.status === "ACTIVE") - (a.status === "ACTIVE") || b.spend - a.spend; });
        S.camps[key] = { list: list }; render(); return list;
      })
      .catch(function (e) { S.camps[key] = { err: e }; render(); throw e; });
  }

  function loadAdsets(accId, campId, fresh) {
    var r = range(S.period), key = campId + "|" + S.period;
    S.adsets[key] = { loading: true }; render();
    return retryOnce(function () { return call("get_meta_campaign_results", { accountId: accId, campaignIds: [campId], startDate: r.startDate, endDate: r.endDate }, { fresh: fresh }); })
      .then(function (p) {
        var res = (p.results || [])[0] || {};
        var list = (res.adSets || []).map(function (a) {
          var ins = a.insights || {};
          return { id: String(a.id), name: a.name, status: a.status, goal: a.optimization_goal_label, spend: num(a.spend), clicks: num(ins.clicks), impressions: num(ins.impressions), results: num(a.conversion_count) };
        });
        S.adsets[key] = { list: list, label: res.conversionLabel }; render(); return list;
      })
      .catch(function (e) { S.adsets[key] = { err: e }; render(); throw e; });
  }

  function actionsMap(arr) { var m = {}; (arr || []).forEach(function (a) { m[a.action_type] = num(a.value); }); return m; }
  function leadsOf(m) { return num(m.lead != null ? m.lead : m["onsite_conversion.lead_grouped"]); }
  function msgsOf(m) { return num(m["onsite_conversion.messaging_conversation_started_7d"]); }

  // ---------- leitura de conta ----------
  function view(a) {
    var s = S.summary[a.id], b = S.balance[a.id], r = range(S.period);
    var v = { a: a, s: s, b: b, spend: s ? num(s.spend) : null, ctr: s ? s.ctr : null, cpc: s ? s.cpc : null, clicks: s ? num(s.clicks) : null };
    if (s) {
      if (a.platform === "google") { v.results = num(s.conversions); v.resLabel = "Conversões"; }
      else { var m = s.actions_by_type || {}; v.leads = leadsOf(m); v.msgs = msgsOf(m); v.results = v.leads + v.msgs; v.resLabel = "Leads + conversas"; }
      v.cpr = v.results ? v.spend / v.results : null;
    }
    v.status = "ativa"; v.statusText = "Ativa"; v.notes = [];
    if (b) {
      if (a.platform === "meta") {
        var st = b.account_status;
        var map = { 2: ["erro", "Desativada"], 3: ["erro", "Pagamento pendente"], 7: ["revisao", "Em análise"], 8: ["erro", "Pagamento pendente"], 9: ["alerta", "Período de carência"], 100: ["pausada", "Encerrando"], 101: ["pausada", "Encerrada"] };
        if (map[st]) { v.status = map[st][0]; v.statusText = map[st][1]; }
        if (b.has_payment_issue) { v.status = "erro"; v.statusText = "Problema de pagamento"; v.notes.push(["erro", b.payment_issue_reason || "Problema na forma de pagamento."]); }
        (b.failed_delivery_checks || []).forEach(function (f) { v.notes.push(["alerta", f.summary || f.description]); });
        if (b.is_prepay_account) {
          v.balLabel = "Saldo"; v.balText = b.available_balance_formatted || b.balance_formatted; v.balNum = parseBRL(v.balText);
        } else {
          v.balLabel = "Pós-pago"; v.balText = num(b.spend_cap) > 0 ? "limite " + (b.spend_cap_formatted || "") : "sem limite";
        }
      } else {
        if (b.show_available_balance && b.available_balance_formatted) { v.balLabel = "Saldo"; v.balText = b.available_balance_formatted; v.balNum = parseBRL(v.balText); }
        else { v.balLabel = "Orçamento"; v.balText = b.is_unlimited ? "ilimitado" : (b.spending_limit_formatted || "—"); }
        if (b.billing_setup_status && b.billing_setup_status !== "APPROVED") v.notes.push(["alerta", "Faturamento: " + b.billing_setup_status]);
      }
      if (v.balNum != null && v.spend != null && v.status === "ativa") {
        var daily = v.spend / r.days;
        if (v.balNum <= 0.5 && daily > 0) { v.status = "erro"; v.statusText = "Sem saldo"; }
        else if (daily > 0 && v.balNum < daily * 3) { v.status = "alerta"; v.statusText = "Saldo baixo"; v.notes.unshift(["alerta", "Saldo cobre ~" + Math.max(0, v.balNum / daily).toFixed(1).replace(".", ",") + " dia(s) no ritmo do período."]); }
      }
    }
    if (s && v.spend === 0 && v.status === "ativa") { v.status = "pausada"; v.statusText = "Sem veiculação"; }
    return v;
  }
  function views() { return S.accounts.map(view); }
  function attention(v) { return v.status === "erro" || v.status === "alerta" || v.notes.length > 0; }

  // ---------- render ----------
  function badge(kind, text) { return '<span class="badge b-' + kind + '">' + esc(text) + "</span>"; }
  function campBadge(st) {
    if (st === "ACTIVE") return badge("ativa", "Ativa");

    if (st === "IN_PROCESS" || st === "PENDING_REVIEW") return badge("revisao", "Em análise");
    if (st === "DISAPPROVED" || st === "WITH_ISSUES") return badge("erro", "Com problema");
    return badge("pausada", String(st || "—").toLowerCase());
  }
  function stateBox(title, text, btn) {
    return '<div class="state"><strong>' + esc(title) + "</strong><span>" + esc(text) + "</span>" + (btn || "") + "</div>";
  }

  function renderNav() {
    var vs = views(), alerts = vs.filter(attention).length;
    var items = [["geral", "Visão geral", ""], ["contas", "Contas", S.accounts.length || ""], ["alertas", "Alertas", alerts || ""], ["assistente", "Assistente", ""], ["historico", "Histórico", S.log.length || ""]];
    document.getElementById("nav").innerHTML = '<div class="brand"><span>›_</span> painel de tráfego</div>' +
      items.map(function (it) {
        var cur = S.screen === it[0] || (it[0] === "contas" && S.screen === "conta");
        return '<button class="nav-item" data-go="' + it[0] + '"' + (cur ? ' aria-current="page"' : "") + ">" + it[1] +
          (it[2] !== "" ? '<span class="count' + (it[0] === "alertas" ? " hot" : "") + '">' + it[2] + "</span>" : "") + "</button>";
      }).join("") +
      '<div class="nav-foot">Dados ao vivo via Criativivo' + (S.updatedAt ? "<br>atualizado " + S.updatedAt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "") + "</div>";
  }

  function periodSeg() {
    return '<div class="seg" role="group" aria-label="Período">' + Object.keys(PERIODS).map(function (k) {
      return '<button data-period="' + k + '" aria-pressed="' + (S.period === k) + '">' + PERIODS[k] + "</button>";
    }).join("") + "</div>";
  }
  function header(eyebrow, title, extra) {
    var r = range(S.period);
    return '<div class="top"><div><div class="label">' + esc(eyebrow) + " · " + r.startDate.split("-").reverse().slice(0, 2).join("/") + (r.days > 1 ? " a " + r.endDate.split("-").reverse().slice(0, 2).join("/") : "") + "</div><h1>" + title + "</h1></div>" +
      '<div class="row">' + periodSeg() + (extra || "") + '<button class="btn btn-secondary" data-act="refresh">Atualizar</button></div></div>';
  }

  function blockers() {
    if (noRuntime) return stateBox("Abra este painel dentro do claude.ai", "Os dados vêm do seu conector Criativivo, que só funciona quando a página está aberta no claude.ai com a sua conta.");
    if (!ready) return '<div class="accs"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    if (S.accErr) return stateBox("Não foi possível listar as contas", errText(S.accErr), '<button class="btn btn-secondary" data-act="refresh">Tentar de novo</button>');
    if (S.loadingAcc) return '<div class="accs"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    if (!S.accounts.length) return stateBox("Nenhuma conta encontrada", "O Criativivo não retornou contas de anúncio para o seu usuário.");
    return null;
  }

  function sectionErrors(list, what) {
    if (!list.length) return "";
    var codes = {}; list.forEach(function (x) { codes[x.e.code] = x.e; });
    return Object.keys(codes).map(function (c) { return '<div class="note erro">' + esc(what) + ": " + esc(errText(codes[c])) + "</div>"; }).join("");
  }

  function kpis(vs) {
    var t = { spend: 0, clicks: 0, imp: 0, leads: 0, msgs: 0, conv: 0, n: 0 };
    vs.forEach(function (v) { if (!v.s) return; t.n++; t.spend += v.spend; t.clicks += v.clicks; t.imp += num(v.s.impressions); t.leads += v.leads || 0; t.msgs += v.msgs || 0; if (v.a.platform === "google") t.conv += v.results; });
    var res = t.leads + t.msgs + t.conv;
    var bal = 0, balN = 0; vs.forEach(function (v) { if (v.balNum != null) { bal += v.balNum; balN++; } });
    function k(l, val, sub) { return '<div class="card kpi"><span class="label">' + l + "</span><b>" + val + "</b><small>" + sub + "</small></div>"; }
    if (S.loadingSum && !t.n) return '<div class="kpis">' + [1, 2, 3, 4].map(function () { return '<div class="skel" style="min-height:96px"></div>'; }).join("") + "</div>";
    return '<div class="kpis">' +
      k("Investimento", brl(t.spend), t.n + " contas com dados") +
      k("Resultados", int(res), int(t.leads) + " leads · " + int(t.msgs) + " conversas · " + int(t.conv) + " conv. Google") +
      k("Custo por resultado", res ? brl(t.spend / res) : "—", "investimento ÷ resultados") +
      k("CTR médio", t.imp ? pct(t.clicks / t.imp * 100) : "—", int(t.clicks) + " cliques") +
      k("Saldo pré-pago", balN ? brl(bal) : "—", balN + " contas com saldo informado") +
      "</div>";
  }

  function accCard(v) {
    var a = v.a;
    return '<button class="card acc" data-open="' + esc(a.id) + '" aria-label="Abrir ' + esc(a.name) + '">' +
      '<div class="acc-head"><div><div class="acc-name">' + esc(a.name) + '</div><div class="acc-id"><span class="plat">' + (a.platform === "google" ? "GOOGLE" : "META") + "</span>" + esc(a.id) + "</div></div>" +
      (v.b || v.s ? badge(v.status, v.statusText) : '<span class="muted">…</span>') + "</div>" +
      v.notes.slice(0, 2).map(function (n) { return '<div class="note ' + n[0] + '">' + esc(n[1]) + "</div>"; }).join("") +
      '<div class="acc-stats">' +
      "<div><span class=\"label\">Investimento</span><b>" + (v.s ? brl(v.spend) : S.loadingSum ? "…" : "—") + "</b></div>" +
      "<div><span class=\"label\">" + esc(v.balLabel || "Saldo") + "</span><b>" + (v.balText ? esc(v.balText) : S.loadingBal ? "…" : "—") + "</b></div>" +
      "<div><span class=\"label\">" + (a.platform === "google" ? "Conversões" : "Leads · conversas") + "</span><b>" + (v.s ? (a.platform === "google" ? int(v.results) : int(v.leads) + " · " + int(v.msgs)) : "—") + "</b></div>" +
      "<div><span class=\"label\">Custo/result.</span><b>" + (v.cpr != null ? brl(v.cpr) : "—") + "</b></div>" +
      "</div></button>";
  }

  function filtered(vs) {
    var q = S.q.trim().toLowerCase();
    vs = vs.filter(function (v) { return (S.plat === "todas" || v.a.platform === S.plat) && (!q || v.a.name.toLowerCase().indexOf(q) >= 0 || v.a.id.indexOf(q) >= 0); });
    var f = { gasto: function (a, b) { return (b.spend || 0) - (a.spend || 0); }, nome: function (a, b) { return a.a.name.localeCompare(b.a.name, "pt-BR"); },
      atencao: function (a, b) { var r = { erro: 0, alerta: 1, revisao: 2, ativa: 3, pausada: 4 }; return r[a.status] - r[b.status] || (b.spend || 0) - (a.spend || 0); },
      cpr: function (a, b) { return (b.cpr || 0) - (a.cpr || 0); } }[S.sort];
    return vs.sort(f);
  }
  function toolbar() {
    return '<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar conta ou ID" value="' + esc(S.q) + '" aria-label="Buscar conta">' +
      '<select class="select" id="plat" aria-label="Plataforma"><option value="todas">Meta e Google</option><option value="meta"' + (S.plat === "meta" ? " selected" : "") + '>Só Meta</option><option value="google"' + (S.plat === "google" ? " selected" : "") + ">Só Google</option></select>" +
      '<select class="select" id="sort" aria-label="Ordenar"><option value="gasto">Maior investimento</option><option value="atencao"' + (S.sort === "atencao" ? " selected" : "") + '>Precisa de atenção</option><option value="cpr"' + (S.sort === "cpr" ? " selected" : "") + '>Maior custo/resultado</option><option value="nome"' + (S.sort === "nome" ? " selected" : "") + ">Nome</option></select></div>";
  }

  function scrGeral() {
    var b = blockers(); var vs = views();
    var top = vs.filter(function (v) { return v.s; }).sort(function (a, c) { return c.spend - a.spend; }).slice(0, 6);
    var al = vs.filter(attention);
    return header("Todas as contas", "Visão geral") + (b || (
      kpis(vs) + sectionErrors(S.sumErr, "Métricas") + sectionErrors(S.balErr, "Saldos") +
      (al.length ? '<section class="row" style="justify-content:space-between"><div class="note alerta">' + al.length + " conta(s) precisam de atenção: " + esc(al.slice(0, 4).map(function (v) { return v.a.name; }).join(", ")) + (al.length > 4 ? "…" : "") + '</div><button class="btn btn-ghost btn-sm" data-go="alertas">Ver alertas ›</button></section>' : "") +
      '<section style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><h2>Maiores investimentos no período</h2><button class="btn btn-ghost btn-sm" data-go="contas">Todas as contas ›</button></div>' +
      (top.length ? '<div class="accs">' + top.map(accCard).join("") + "</div>" : S.loadingSum ? '<div class="accs"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>' : stateBox("Sem investimento no período", "Nenhuma conta gastou em " + PERIODS[S.period].toLowerCase() + ". Troque o período acima.")) +
      "</section>" + quickAsk()));
  }
  function quickAsk() {
    if (!sample) return "";

      '<div class="chips">' + ["quais contas estão com saldo baixo?", "qual conta teve o pior custo por resultado?", "resuma o período em 3 pontos"].map(function (s) { return '<button class="chip" data-ask="' + esc(s) + '">' + esc(s) + "</button>"; }).join("") + "</div></section>";
  }
  function cmdBar(id) {

  }

  function scrContas() {
    var b = blockers();

      (function () { var vs = filtered(views()); return vs.length ? '<div class="accs">' + vs.map(accCard).join("") + "</div>" : stateBox("Nenhuma conta com esse filtro", "Limpe a busca ou troque a plataforma."); })()));
  }

  function scrAlertas() {

  function scrConta() {

    var k = '<div class="kpis">' +
      '<div class="card kpi"><span class="label">Investimento</span><b>' + (v.s ? brl(v.spend) : "—") + "</b><small>" + (v.s ? int(v.s.impressions) + " impressões" : "") + "</small></div>" +
      '<div class="card kpi"><span class="label">' + (a.platform === "google" ? "Conversões" : "Leads · conversas") + "</span><b>" + (v.s ? (a.platform === "google" ? int(v.results) : int(v.leads) + " · " + int(v.msgs)) : "—") + "</b><small>custo/result. " + (v.cpr != null ? brl(v.cpr) : "—") + "</small></div>" +
      '<div class="card kpi"><span class="label">CTR · CPC</span><b>' + (v.s ? pct(v.ctr) : "—") + "</b><small>CPC " + (v.s ? brl(v.cpc) : "—") + " · CPM " + (v.s ? brl(v.s.cpm) : "—") + "</small></div>" +
      '<div class="card kpi"><span class="label">' + esc(v.balLabel || "Saldo") + "</span><b>" + esc(v.balText || "—") + "</b><small>" + (v.b && v.b.amount_spent_formatted ? "gasto total " + esc(v.b.amount_spent_formatted) : "") + "</small></div></div>" +
      v.notes.map(function (n) { return '<div class="note ' + n[0] + '">' + esc(n[1]) + "</div>"; }).join("");
    if (a.platform !== "meta") return h + k + stateBox("Campanhas do Google ainda não estão nesta tela", "Os números acima são da conta inteira. Pause, ative e edite orçamentos de campanhas Meta; o Google entra na próxima versão.");

      c.list.map(function (x) { return campRow(a, x); }).join("") + "</tbody></table></div>";
    return h + k + '<section style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><h2>Campanhas</h2><span class="muted" style="font-size:12px">Ligar/desligar e mudar orçamento sempre pedem confirmação.</span></div>' + body + "</section>";
  }

  function campRow(a, x) {
    var res = x.leads + x.msgs, on = x.status === "ACTIVE", canToggle = x.status === "ACTIVE" || x.status === "PAUSED";
    var open = S.open[x.id], edited = S.log.some(function (l) { return l.entityId === x.id && Date.now() - l.at < 36e5; });
    var html = '<tr class="' + (edited ? "edited" : "") + '"><td><button class="toggle" role="switch" aria-checked="' + on + '" aria-label="' + (on ? "Pausar " : "Ativar ") + esc(x.name) + '"' + (canToggle ? "" : " disabled") +

  function budgetVal() { var i = document.getElementById("budget-input"); if (!i) return null; var n = parseFloat(i.value.replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; }

  // ---------- edição ----------
  function accName(id) { var a = S.accounts.filter(function (x) { return x.id === id; })[0]; return a ? a.name : id; }
  function propose(p) { S.pending = p; S.busy = false; renderOverlay(); }
  function confirmPending() {
    var p = S.pending; if (!p || S.busy) return;
    var input, tool;
    if (p.kind === "budget") { var n = budgetVal(); if (n == null || n < 1) return; p.value = n; p.to = brl(n); p.from = p.current != null ? brl(p.current) : "não informado"; tool = "update_meta_budget"; input = { accountId: p.accountId, entityType: p.entityType, entityId: p.entityId, dailyBudget: n }; }
    else { tool = "update_meta_status"; input = { accountId: p.accountId, entityType: p.entityType, entityId: p.entityId, status: p.to === "Pausada" ? "PAUSED" : "ACTIVE" }; }
    S.busy = true; p.error = null; renderOverlay();
    call(tool, input, { write: true }).then(function () {
      S.log.unshift({ at: Date.now(), what: p.kind === "budget" ? "Orçamento diário" : "Status", name: p.name, entityId: p.entityId, account: p.account, from: p.from, to: p.to });

      if (mcp.invalidate) mcp.invalidate(SERVER).catch(function () {});
      if (p.resolve) p.resolve("Aplicado: " + p.name + " " + p.from + " → " + p.to);
      S.pending = null; S.busy = false; renderOverlay(); render();
      toast((p.kind === "budget" ? "Orçamento salvo: " : p.to === "Pausada" ? "Pausada: " : "Ativada: ") + p.name, "ok");

  function ask(text) {

      "Para pausar, ativar ou mudar orçamento diário, chame propor_alteracao: ela abre uma janela de confirmação na tela e só aplica se o usuário confirmar. Diga ao usuário que a confirmação está aberta. " +
      "Orçamento só pode ser mudado em campanha CBO ou em conjunto. Campanhas do Google não podem ser editadas aqui.";

    if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: text });
    var ctl = new AbortController(); S.chatCtl = ctl;
    var tools = [
      { name: "resumo_contas", description: "Lista todas as contas carregadas no painel com investimento, leads, conversas, custo por resultado, CTR, saldo, status e alertas do período atual.",
        execute: function () { reply.tools.push("resumo_contas"); render(); return compactAccounts(); } },
      { name: "campanhas_da_conta", description: "Campanhas de uma conta Meta no período atual: id, nome, status, CBO, orçamento diário (se CBO), investimento, leads, conversas, CTR.",
        inputSchema: { type: "object", properties: { accountId: { type: "string" } }, required: ["accountId"] },
        execute: function (inp) { var id = String(inp.accountId); reply.tools.push("campanhas · " + accName(id)); render();
          return loadCampaigns(id).then(function (l) { return l.map(function (c) { return { id: c.id, nome: c.name, status: c.status, cbo: c.cbo, orcamento_diario: c.daily, investimento: c.spend, leads: c.leads, conversas: c.msgs, ctr: c.ctr }; }); }); } },
      { name: "conjuntos_da_campanha", description: "Conjuntos de anúncios de uma campanha Meta: id, nome, status, investimento, resultados.",

        execute: function (inp) { reply.tools.push("conjuntos · " + inp.campaignId); render();
          return loadAdsets(String(inp.accountId), String(inp.campaignId)).then(function (l) { return l.map(function (s) { return { id: s.id, nome: s.name, status: s.status, investimento: s.spend, resultados: s.results }; }); }); } },
      { name: "propor_alteracao", description: "Abre na tela a confirmação para pausar, ativar ou mudar o orçamento diário de uma campanha ou conjunto Meta. Retorna se o usuário confirmou ou cancelou.",
        inputSchema: { type: "object", properties: { accountId: { type: "string" }, entityType: { type: "string", enum: ["campaign", "adset"] }, entityId: { type: "string" }, nome: { type: "string" }, acao: { type: "string", enum: ["pausar", "ativar", "orcamento"] }, valor: { type: "number", description: "Novo orçamento diário em reais (só para acao=orcamento)" }, campaignId: { type: "string", description: "Campanha do conjunto, quando entityType=adset" } }, required: ["accountId", "entityType", "entityId", "nome", "acao"] },
        execute: function (inp) {

          reply.tools.push("propor_alteracao · " + inp.acao + " · " + inp.nome); render();
          return new Promise(function (resolve) {
            var base = { accountId: acc.id, account: acc.name, entityType: inp.entityType === "adset" ? "adset" : "campaign", entityId: String(inp.entityId), name: String(inp.nome), campId: inp.campaignId ? String(inp.campaignId) : null, via: "assistente", resolve: resolve };
            if (inp.acao === "orcamento") { var cur = null, c = S.camps[acc.id + "|" + S.period]; if (c && c.list) c.list.forEach(function (x) { if (x.id === base.entityId) cur = x.daily; }); propose(Object.assign(base, { kind: "budget", current: cur, value: inp.valor != null ? Number(inp.valor) : null })); }

  // ---------- eventos ----------

      return;
